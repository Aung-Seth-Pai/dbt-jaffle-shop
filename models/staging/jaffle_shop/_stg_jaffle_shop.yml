models:
  - name: stg_jaffle_shop__orders
    description: one order per row
    columns:
      - name: order_id
        description: PK for order table
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
        - relationships:
            arguments: 
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
      - name: order_date
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'shipped', 'placed', 'return_pending', 'returned']
  - name: stg_jaffle_shop__customers
    description: one unique customer per row
    columns:
      - name: customer_id
        description: PK for customer table
      - name: first_name
      - name: last_name