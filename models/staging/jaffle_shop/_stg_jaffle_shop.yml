version: 2

models:
  - name: stg_jaffle_shop__orders
    description: >
      One order per row. staging model over the raw application orders
    columns:
      - name: order_id
        description: PK for order table
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: FK to stg_jaffle_shop__customers. The customer who placed the order.
        data_tests:
        - not_null
        - relationships:
            arguments: 
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'shipped', 'placed', 'return_pending', 'returned']
  - name: stg_jaffle_shop__customers
    description: >
      One unique customer per row. staging model over the raw application
      customers table
    columns:
      - name: customer_id
        description: PK for customer table
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name, as entered in the source application.
      - name: last_name
        description: Customer last name, as entered in the source application.
