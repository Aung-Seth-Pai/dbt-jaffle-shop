version: 2

sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    description: a clone of a Postgres application database
    tables:
      - name: orders
        description: raw orders data
        columns:
          - name: id
            description: PK for order data
            data_tests:
              - unique
              - not_null
          - name: user_id
          - name: order_date
          - name: status
        config:
          freshness:
            warn_after:
              count: 6
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: _etl_loaded_at
      - name: customers
        description: raw customer data
        columns:
          - name: id
            description: PK for customer data
            data_tests:
              - unique
              - not_null
          - name: first_name
          - name: last_name