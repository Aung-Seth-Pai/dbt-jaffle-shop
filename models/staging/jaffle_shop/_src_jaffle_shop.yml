version: 2

sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    description: a clone of a Postgres application database
    tables:
      - name: orders
        description: raw orders data
        columns:
          - name: id
            description: PK for order data
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: FK to jaffle_shop.customers
          - name: order_date
            description: Date the order was placed
          - name: status
            description: Current state of the order
        config:
          freshness:
            warn_after:
              count: 6
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: "cast(_etl_loaded_at as timestamp)"
      - name: customers
        description: raw customer data
        columns:
          - name: id
            description: PK for customer data
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name
          - name: last_name
            description: Customer last name